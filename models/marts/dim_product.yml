models:
  - name: dim_product
    description: >
      A table that lists and details products, including information such as product name, subcategory and category names, weight, and discontinued 
      date (if applicable).
    columns:
      - name: product_pk
        description: Unique identifier for each product.
        tests:
          - unique
          - not_null
      
      - name: discontinued_date
        description: The date when the sales of the product were discontinued, if applicable.

      - name: product_name
        description: The name of the product.

      - name: subcategory_name
        description: The name of the product subcategory.
        
      - name: category_name
        description: The name of the product category.