models:
  - name: dim_customer
    description: >
      A table that lists and details customers, including information such as the person's full name and the store name (in case the order was placed 
      by a company). If both fields contain values, it indicates that the purchase was made by a company through a representative.
    columns:
      - name: customer_pk
        description: Unique identifier for each customer.
        tests:
          - unique
          - not_null

      - name: person_fk
        description: Foreign key used to link the stg_erp__person table with the stg_erp__customer table.
        
      - name: store_fk
        description: Foreign key used to link the stg_erp__store table with the stg_erp__customer table.

      - name: salesperson_fk
        description: Foreign key that identifies the person representing the store customer.

      - name: person_type
        description: Indicates the business role or type of the person.

      - name: person_full_name
        description: The full name of the person, composed of the first and last name only.

      - name: store_name
        description: The name of the store client